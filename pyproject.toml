[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "planar-physics"
version = "0.2.0"
description = "Planar serial arm: collision certification, OMPL planning, SAC step policy, KTO curve step and simulated execution."
requires-python = ">=3.14"
dependencies = ["drake==1.57.0", "numpy==2.5.3", "matplotlib==3.11.2", "pyyaml==6.0.3"]

[project.optional-dependencies]
learn = ["stable-baselines3==2.9.0", "gymnasium==1.3.0", "torch==2.11.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/planar_physics", "src/planar_dynamics", "src/planar_learn", "src/planar_eval", "src/dashboard"]
